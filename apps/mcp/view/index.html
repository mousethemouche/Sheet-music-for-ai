<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Filled by the MCP server when it serves this document (view-resource.ts); keep verbatim. -->
    <meta name="sheet-music-asset-origin" content="" />
    <title>Sheet Music for AI - score view</title>
    <style>
      /* Document box only; the View's look is src/view.css (bundled inline). */
      :root {
        color-scheme: light dark;
        /* No background of its own: the host's shows through the iframe. */
        background: transparent;
      }
      body {
        margin: 0;
      }
      #root {
        box-sizing: border-box;
        overflow: auto;
        padding: 12px 16px;
      }
      /* Phone-width chats: the notation keeps more of the frame's width. */
      @media (max-width: 400px) {
        #root {
          padding-inline: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
