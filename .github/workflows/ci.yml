name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # TEST_PLAN §8: documentation-only changes do not start a database or a browser.
      - id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="$PUSH_BEFORE_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then base="$PR_BASE_SHA"; fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD | grep -qvE '^docs/|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # CI-01 + CI-02: frozen install, typecheck, lint, independent app builds,
  # unit/component tests (no DB, no browser) and the architecture rules.
  quality:
    name: Typecheck, lint, build, unit/component tests, architecture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm check:arch

  # CI-03: real API/MCP/DB integration against one isolated Postgres per job,
  # files run serially in one worker (see vitest.config.ts).
  integration:
    name: Integration (Postgres)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sheet_music_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sheet_music_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway service-container credentials; never production data.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sheet_music_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  # MCP-UI integration sub-suite (#11 MCP-UI-01..03), one Chromium worker.
  # Gated placeholder until #11 lands its scenarios: run manually, or set the
  # repository variable MCP_UI_ENABLED=true. CI-05 (#17) then decides the
  # path-based trigger for MCP/View/bridge/asset/contract changes.
  mcp-ui:
    name: MCP-UI integration (Chromium)
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'workflow_dispatch' || vars.MCP_UI_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sheet_music_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sheet_music_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sheet_music_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The suite exercises the production-built View bundle.
      - run: pnpm build
      - run: pnpm test:mcp-ui
